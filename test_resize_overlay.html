<!DOCTYPE html>
<html>
<body>
  <div id="container" style="position: relative; width: 500px; padding: 20px; border: 1px solid black;">
    <div id="editor" contenteditable="true" style="min-height: 200px;">
      <p>Some text</p>
      <img id="myimg" src="https://via.placeholder.com/150" style="width: 150px; height: 150px; display: inline-block;" />
      <p>More text</p>
    </div>
    
    <div id="overlay" style="position: absolute; border: 2px dashed red; display: none;">
      <div id="handle" style="position: absolute; right: -5px; bottom: -5px; width: 10px; height: 10px; background: red; cursor: nwse-resize;"></div>
    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const overlay = document.getElementById('overlay');
    const handle = document.getElementById('handle');
    let selectedImage = null;

    editor.addEventListener('click', (e) => {
      if (e.target.tagName === 'IMG') {
        selectedImage = e.target;
        updateOverlay();
      } else {
        selectedImage = null;
        overlay.style.display = 'none';
      }
    });

    function updateOverlay() {
      if (!selectedImage) return;
      const containerRect = document.getElementById('container').getBoundingClientRect();
      const imgRect = selectedImage.getBoundingClientRect();
      
      overlay.style.display = 'block';
      overlay.style.top = (imgRect.top - containerRect.top + document.getElementById('container').scrollTop) + 'px';
      overlay.style.left = (imgRect.left - containerRect.left + document.getElementById('container').scrollLeft) + 'px';
      overlay.style.width = imgRect.width + 'px';
      overlay.style.height = imgRect.height + 'px';
    }

    let isResizing = false;
    let startX, startY, startWidth, startHeight;

    handle.addEventListener('mousedown', (e) => {
      isResizing = true;
      startX = e.clientX;
      startY = e.clientY;
      startWidth = selectedImage.offsetWidth;
      startHeight = selectedImage.offsetHeight;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const dx = e.clientX - startX;
      // const dy = e.clientY - startY; // preserve aspect ratio
      const newWidth = Math.max(50, startWidth + dx);
      const newHeight = newWidth * (startHeight / startWidth);
      
      selectedImage.style.width = newWidth + 'px';
      selectedImage.style.height = newHeight + 'px';
      updateOverlay();
    });

    document.addEventListener('mouseup', () => {
      isResizing = false;
    });

    // Update on scroll/input
    editor.addEventListener('input', updateOverlay);
    editor.addEventListener('scroll', updateOverlay);
    editor.addEventListener('keyup', updateOverlay);
  </script>
</body>
</html>
